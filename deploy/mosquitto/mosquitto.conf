# MQTT-брокер для шлюзов площадки (S4-06). Шлюзы входят по логину и паролю из файла passwd:
#   docker compose -f deploy.yml --profile mqtt run --rm mosquitto \
#     mosquitto_passwd -b /mosquitto/config/passwd <логин> <пароль>
# При работе через интернет включите TLS на 8883 (сертификаты в этой же папке).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/
