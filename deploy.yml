# Прод-стенд. Запуск: docker compose -f deploy.yml up -d
# Образы backend и frontend собираются в GitHub Actions и лежат в GHCR (см. .github/workflows/deploy.yml).
# Для локальной проверки прод-сборки: docker compose -f deploy.yml build
# Все секреты задаются в .env рядом с этим файлом (шаблон: deploy.env.example), значений по умолчанию нет.
# Снаружи открыт только nginx (80; 443 после настройки HTTPS).

x-required-secrets:
  postgres-password: &postgres-password ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  s3-access-key: &s3-access-key ${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY:?set INCIDENT_ATTACHMENTS_S3_ACCESS_KEY in .env}
  s3-secret-key: &s3-secret-key ${INCIDENT_ATTACHMENTS_S3_SECRET_KEY:?set INCIDENT_ATTACHMENTS_S3_SECRET_KEY in .env}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - grafana
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - broiler-network

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broiler_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-broiler}
      POSTGRES_PASSWORD: *postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - broiler-network

  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: ${INFLUXDB_DB:-broiler_telemetry}
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD-SHELL", "influx -execute 'SHOW DATABASES'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - broiler-network

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - broiler-network

  minio:
    # Официальные образы minio/minio удалены из Docker Hub, а cgr.dev отвечает 403 части пользователей.
    # Берём архив Bitnami с Docker Hub с закреплённым тегом. Бакет backend создаёт сам при первой загрузке.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: *s3-access-key
      MINIO_ROOT_PASSWORD: *s3-secret-key
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - broiler-network

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/koronus/broilerproject}-backend:${IMAGE_TAG:-latest}
    build: ./backend/broiler_monitoring
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-broiler_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-broiler}
      POSTGRES_PASSWORD: *postgres-password
      TELEMETRY_INFLUX_URL: http://influxdb:8086
      INFLUXDB_DB: ${INFLUXDB_DB:-broiler_telemetry}
      TELEMETRY_INGEST_API_KEY: ${TELEMETRY_INGEST_API_KEY:?set TELEMETRY_INGEST_API_KEY in .env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?set AUTH_BOOTSTRAP_ADMIN_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SENSOR_SIMULATION_ENABLED: ${SENSOR_SIMULATION_ENABLED:-true}
      SENSOR_SIMULATION_TARGET_URL: http://localhost:8080/api/v1/telemetry/readings
      SENSOR_SIMULATION_GATEWAY_ID: GW-FARM-1-HOUSE-4
      SENSOR_SIMULATION_INTERVAL_MS: 600000
      SENSOR_SIMULATION_INITIAL_DELAY_MS: 15000
      INCIDENT_ATTACHMENTS_S3_ENDPOINT: http://minio:9000
      INCIDENT_ATTACHMENTS_S3_REGION: ${INCIDENT_ATTACHMENTS_S3_REGION:-us-east-1}
      INCIDENT_ATTACHMENTS_S3_BUCKET: ${INCIDENT_ATTACHMENTS_S3_BUCKET:-broiler-incident-attachments}
      INCIDENT_ATTACHMENTS_S3_ACCESS_KEY: *s3-access-key
      INCIDENT_ATTACHMENTS_S3_SECRET_KEY: *s3-secret-key
      INCIDENT_ATTACHMENTS_S3_PATH_STYLE_ACCESS: "true"
      INCIDENT_ATTACHMENTS_MAX_FILE_SIZE: ${INCIDENT_ATTACHMENTS_MAX_FILE_SIZE:-300MB}
      INCIDENT_ATTACHMENTS_MAX_REQUEST_SIZE: ${INCIDENT_ATTACHMENTS_MAX_REQUEST_SIZE:-900MB}
      INCIDENT_ATTACHMENTS_MAX_FILE_SIZE_BYTES: ${INCIDENT_ATTACHMENTS_MAX_FILE_SIZE_BYTES:-314572800}
    networks:
      - broiler-network

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/koronus/broilerproject}-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SPRING_API_URL: http://backend:8080
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    networks:
      - broiler-network

volumes:
  postgres_data:
  influxdb_data:
  grafana_data:
  minio_data:

networks:
  broiler-network:
    driver: bridge
