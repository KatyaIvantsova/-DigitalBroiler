spring.application.name=broiler_monitoring
server.port=8080
# Локально значения берутся из .env (cp .env.example .env), на сервере — из окружения.
# Секреты (пароли, ключи) не имеют значений по умолчанию: без них приложение не стартует.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:${POSTGRES_PORT:5434}/${POSTGRES_DB:broiler_monitoring}}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# V15/V16 (демо-данные) перенесены в db/demo; на базах, где они уже применены, это не ошибка.
spring.flyway.ignore-migration-patterns=*:missing

telemetry.influx.url=${TELEMETRY_INFLUX_URL:http://localhost:8086}
telemetry.influx.database=${INFLUXDB_DB:broiler_telemetry}
telemetry.ingest.api-key=${TELEMETRY_INGEST_API_KEY:}

sensor.simulation.enabled=${SENSOR_SIMULATION_ENABLED:true}
sensor.simulation.target-url=${SENSOR_SIMULATION_TARGET_URL:http://localhost:8080/api/v1/telemetry/readings}
sensor.simulation.gateway-id=${SENSOR_SIMULATION_GATEWAY_ID:GW-FARM-1-HOUSE-4}
sensor.simulation.interval-ms=${SENSOR_SIMULATION_INTERVAL_MS:600000}
sensor.simulation.initial-delay-ms=${SENSOR_SIMULATION_INITIAL_DELAY_MS:15000}

spring.servlet.multipart.max-file-size=${INCIDENT_ATTACHMENTS_MAX_FILE_SIZE:300MB}
spring.servlet.multipart.max-request-size=${INCIDENT_ATTACHMENTS_MAX_REQUEST_SIZE:900MB}

incident.attachments.max-file-size-bytes=${INCIDENT_ATTACHMENTS_MAX_FILE_SIZE_BYTES:314572800}
incident.attachments.s3.endpoint=${INCIDENT_ATTACHMENTS_S3_ENDPOINT:http://localhost:9000}
incident.attachments.s3.region=${INCIDENT_ATTACHMENTS_S3_REGION:us-east-1}
incident.attachments.s3.bucket=${INCIDENT_ATTACHMENTS_S3_BUCKET:broiler-incident-attachments}
incident.attachments.s3.access-key=${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY}
incident.attachments.s3.secret-key=${INCIDENT_ATTACHMENTS_S3_SECRET_KEY}
incident.attachments.s3.path-style-access=${INCIDENT_ATTACHMENTS_S3_PATH_STYLE_ACCESS:true}

auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.ttl=${AUTH_JWT_TTL:12h}
auth.bootstrap-admin.username=${AUTH_BOOTSTRAP_ADMIN_USERNAME:}
auth.bootstrap-admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Сообщения ResponseStatusException и ошибки валидации полей уходят клиенту — их показывает интерфейс.
# Стектрейсы и классы исключений наружу не отдаются.
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
server.error.include-message=always
server.error.include-binding-errors=always

# Движок правил (S3-03…S3-07): цикл проверки норм раз в минуту
rules.evaluation.enabled=${RULES_EVALUATION_ENABLED:true}
rules.evaluation.interval-ms=${RULES_EVALUATION_INTERVAL_MS:60000}
rules.evaluation.initial-delay-ms=${RULES_EVALUATION_INITIAL_DELAY_MS:60000}

# MQTT-шлюз телеметрии (S4-06): выключен по умолчанию, топики broiler/<site>/<house>/<sensorCode>
mqtt.enabled=${MQTT_ENABLED:false}
mqtt.url=${MQTT_URL:tcp://localhost:1883}
mqtt.topic=${MQTT_TOPIC:broiler/#}
mqtt.client-id=${MQTT_CLIENT_ID:broiler-backend}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.batch-size=${MQTT_BATCH_SIZE:200}
mqtt.flush-interval-ms=${MQTT_FLUSH_INTERVAL_MS:5000}
