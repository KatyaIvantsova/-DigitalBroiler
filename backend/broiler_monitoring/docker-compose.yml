# Локальная инфраструктура для разработки: Postgres, InfluxDB, Grafana, MinIO.
# Значения берутся из .env рядом с этим файлом (cp .env.example .env).
# Порты открыты только на 127.0.0.1. Прод-сборка описана в deploy.yml в корне.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: ${INFLUXDB_DB:-broiler_telemetry}
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - broiler_influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD-SHELL", "influx -execute 'SHOW DATABASES'"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - broiler_grafana_data:/var/lib/grafana
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro

  minio:
    # Официальные образы minio/minio удалены из Docker Hub, а cgr.dev отвечает 403 части пользователей.
    # Берём архив Bitnami с Docker Hub с закреплённым тегом. Бакет backend создаёт сам при первой загрузке.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY:?set INCIDENT_ATTACHMENTS_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${INCIDENT_ATTACHMENTS_S3_SECRET_KEY:?set INCIDENT_ATTACHMENTS_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - broiler_minio_data:/bitnami/minio/data

  mosquitto:
    # MQTT-брокер для проверки шлюза S4-06 на локальной машине, без логина:
    # docker compose --profile mqtt up -d mosquitto, затем MQTT_ENABLED=true для backend
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "127.0.0.1:1883:1883"

volumes:
  postgres_data:
  broiler_influxdb_data:
  broiler_grafana_data:
  broiler_minio_data:
